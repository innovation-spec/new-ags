services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agasthya
      POSTGRES_PASSWORD: agasthya
      POSTGRES_DB: agasthya
    ports: ["15432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agasthya -d agasthya"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: agasthya
      MINIO_ROOT_PASSWORD: agasthya-demo-secret
    ports:
      - "19000:9000"
      - "19001:9001"
