services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agasthya
      POSTGRES_PASSWORD: agasthya
      POSTGRES_DB: agasthya
    ports: ["15432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agasthya -d agasthya"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: agasthya
      MINIO_ROOT_PASSWORD: agasthya-demo-secret
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 agasthya agasthya-demo-secret; do sleep 2; done;
      mc mb --ignore-existing local/agasthya-models;
      mc mb --ignore-existing local/agasthya-datasets;
      mc mb --ignore-existing local/agasthya-artifacts;
      mc mb --ignore-existing local/agasthya-reports;
      mc mb --ignore-existing local/agasthya-state-archives;"

  temporal:
    image: temporalio/auto-setup:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: agasthya
      POSTGRES_PWD: agasthya
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    ports: ["17233:7233"]

  temporal-ui:
    image: temporalio/ui:latest
    depends_on:
