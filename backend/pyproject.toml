[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agasthya-demo-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.43,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "redis>=6.4,<7",
  "minio>=7.2,<8",
  "temporalio>=1.18,<2",
  "openai>=1.100,<3",
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2"]
